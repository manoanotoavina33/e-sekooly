databases:
  - name: e-sekooly-db
    databaseName: e_sekooly
    plan: free

services:
  - type: web
    name: e-sekooly-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && chmod +x node_modules/.bin/prisma && npx --yes prisma generate && npx --yes prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: e-sekooly-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_DAYS
        value: 30
      - key: CORS_ORIGIN
        sync: false
